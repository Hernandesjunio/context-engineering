    type: forbiddenClaim
    sourceOriginal: SRC-016
    sourceCurrent: RULE-ASYNC-001#proibicao
    statement: "SignalR é a fonte oficial do estado."
    evaluationMethod: semantic
    verifyWith: [approvedLlmJudge]
expected:
