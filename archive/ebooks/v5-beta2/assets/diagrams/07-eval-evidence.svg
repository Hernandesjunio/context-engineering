<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" rx="28" fill="#F5F7FB"/>
  <style>.title{font:700 33px 'DejaVu Sans',sans-serif;fill:#17212B}.h{font:700 20px 'DejaVu Sans',sans-serif;fill:white}.t{font:400 16px 'DejaVu Sans',sans-serif;fill:#425166}.light{fill:white}.edge{stroke:#2E66E8;stroke-width:3;fill:none}.phase{font:700 18px 'DejaVu Sans',sans-serif;fill:#2E66E8}</style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2E66E8"/></marker></defs>
  <text x="45" y="58" class="title">Da fonte aprovada ao Evidence Record</text>
  <text x="55" y="110" class="phase">AUTORIA DA EXPECTATIVA</text>

  <rect x="55" y="135" width="235" height="125" rx="18" fill="#0B1B34"/>
  <text x="173" y="183" class="h" text-anchor="middle">Fontes aprovadas</text>
  <text x="173" y="216" class="t light" text-anchor="middle">requisito · rule · contract</text>
  <path d="M290 198 H355" class="edge" marker-end="url(#arrow)"/>

  <rect x="365" y="135" width="220" height="125" rx="18" fill="#2E66E8"/>
  <text x="475" y="183" class="h" text-anchor="middle">Assertions</text>
  <text x="475" y="216" class="t light" text-anchor="middle">obrigações e proibições</text>
  <path d="M585 198 H650" class="edge" marker-end="url(#arrow)"/>

  <rect x="660" y="135" width="220" height="125" rx="18" fill="#6A57D2"/>
  <text x="770" y="183" class="h" text-anchor="middle">Eval Spec</text>
  <text x="770" y="213" class="t light" text-anchor="middle">retrieve · apply · not claim</text>
  <path d="M770 260 V350" class="edge" marker-end="url(#arrow)"/>

  <text x="55" y="350" class="phase">EXECUÇÃO E COMPARAÇÃO</text>
  <rect x="660" y="375" width="220" height="125" rx="18" fill="#1C8A68"/>
  <text x="770" y="423" class="h" text-anchor="middle">Executar agente</text>
  <text x="770" y="456" class="t light" text-anchor="middle">fontes · resposta · tools</text>
  <path d="M660 438 H595" class="edge" marker-end="url(#arrow)"/>

  <rect x="365" y="375" width="220" height="125" rx="18" fill="#C85A00"/>
  <text x="475" y="423" class="h" text-anchor="middle">Avaliar</text>
  <text x="475" y="456" class="t light" text-anchor="middle">esperado × observado</text>
  <path d="M365 438 H300" class="edge" marker-end="url(#arrow)"/>

  <rect x="55" y="375" width="235" height="125" rx="18" fill="#147D7E"/>
  <text x="173" y="423" class="h" text-anchor="middle">Evidence Record</text>
  <text x="173" y="456" class="t light" text-anchor="middle">PASS · FAIL · INCONCLUSIVE</text>

  <rect x="55" y="555" width="825" height="82" rx="16" fill="white" stroke="#9AA8B8" stroke-width="2"/>
  <text x="85" y="588" style="font:700 17px 'DejaVu Sans',sans-serif;fill:#17212B">Regra de leitura</text>
  <text x="270" y="588" class="t">o Eval Spec fixa a expectativa antes da execução;</text>
  <text x="270" y="615" class="t">o Evidence Record preserva fatos, comparação e veredito.</text>
</svg>
