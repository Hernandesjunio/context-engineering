<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" rx="28" fill="#F5F7FB"/>
  <style>.title{font:700 34px 'DejaVu Sans',sans-serif;fill:#17212B}.h{font:700 20px 'DejaVu Sans',sans-serif;fill:white}.t{font:400 16px 'DejaVu Sans',sans-serif;fill:#425166}.small{font:400 15px 'DejaVu Sans',sans-serif;fill:#425166}.light{fill:white}.edge{stroke:#2E66E8;stroke-width:3;fill:none}</style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2E66E8"/></marker></defs>
  <text x="45" y="58" class="title">Do pedido à evidência no runtime de referência</text>

  <rect x="50" y="145" width="190" height="115" rx="18" fill="#0B1B34"/>
  <text x="145" y="195" class="h" text-anchor="middle">Pedido</text>
  <text x="145" y="228" class="small light" text-anchor="middle">objetivo e entrada</text>
  <path d="M240 202 H300" class="edge" marker-end="url(#arrow)"/>

  <rect x="310" y="130" width="210" height="145" rx="18" fill="#2E66E8"/>
  <text x="415" y="185" class="h" text-anchor="middle">Montar contexto</text>
  <text x="415" y="218" class="small light" text-anchor="middle">rule · agent · skill</text>
  <text x="415" y="247" class="small light" text-anchor="middle">playbook · knowledge</text>
  <path d="M520 202 H580" class="edge" marker-end="url(#arrow)"/>

  <rect x="590" y="145" width="190" height="115" rx="18" fill="#1C8A68"/>
  <text x="685" y="195" class="h" text-anchor="middle">Executar</text>
  <text x="685" y="228" class="small light" text-anchor="middle">search · MCP · script</text>
  <path d="M780 202 H840" class="edge" marker-end="url(#arrow)"/>

  <rect x="850" y="145" width="190" height="115" rx="18" fill="#147D7E"/>
  <text x="945" y="195" class="h" text-anchor="middle">Capturar</text>
  <text x="945" y="228" class="small light" text-anchor="middle">fontes · tools · estado</text>
  <path d="M945 260 V365" class="edge" marker-end="url(#arrow)"/>

  <rect x="805" y="380" width="235" height="110" rx="18" fill="#C85A00"/>
  <text x="923" y="427" class="h" text-anchor="middle">Avaliar</text>
  <text x="923" y="458" class="small light" text-anchor="middle">esperado × observado</text>
  <path d="M805 435 H690" class="edge" marker-end="url(#arrow)"/>

  <rect x="480" y="380" width="200" height="110" rx="18" fill="#6A57D2"/>
  <text x="580" y="427" class="h" text-anchor="middle">Evidenciar</text>
  <text x="580" y="458" class="small light" text-anchor="middle">veredito auditável</text>

  <rect x="50" y="350" width="340" height="165" rx="18" fill="white" stroke="#9AA8B8" stroke-width="2"/>
  <text x="80" y="393" style="font:700 18px 'DejaVu Sans',sans-serif;fill:#17212B">Perguntas de controle</text>
  <text x="80" y="432" class="t">Quem interpretou cada artefato?</text>
  <text x="80" y="464" class="t">Qual dado comprova a transição?</text>
  <text x="80" y="496" class="t">O que ficou inconclusivo?</text>

  <text x="600" y="600" class="t" text-anchor="middle">Nome correto não prova ativação: cada transição precisa deixar um rastro observável.</text>
</svg>
