<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <rect width="1200" height="650" rx="28" fill="#F5F7FB"/>
  <style>
    .title{font:700 34px 'DejaVu Sans',sans-serif;fill:#17212B}.h{font:700 21px 'DejaVu Sans',sans-serif;fill:#17212B}.t{font:400 18px 'DejaVu Sans',sans-serif;fill:#425166}.tag{font:700 18px 'DejaVu Sans',sans-serif;fill:white}.arrow{stroke:#2E66E8;stroke-width:3;fill:none}
  </style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2E66E8"/></marker></defs>
  <text x="52" y="58" class="title">Do manual caótico ao sistema consultável</text>

  <rect x="40" y="105" width="405" height="450" rx="24" fill="#FFF8ED" stroke="#E79B35" stroke-width="3"/>
  <text x="70" y="155" class="h">Um arquivo, papéis misturados</text>
  <text x="70" y="210" class="t">regra + dica + procedimento</text>
  <text x="70" y="250" class="t">histórico + teste + exemplo</text>
  <line x1="70" y1="285" x2="415" y2="285" stroke="#E3C79E" stroke-width="2"/>
  <text x="70" y="335" class="t">mesmo peso visual</text>
  <text x="70" y="375" class="t">ativação implícita</text>
  <text x="70" y="415" class="t">autoridade ambígua</text>
  <text x="70" y="455" class="t">difícil provar o uso</text>

  <path d="M485 330 H675" class="arrow" marker-end="url(#arrow)"/>
  <text x="580" y="300" class="h" fill="#2E66E8" text-anchor="middle">separar por função</text>

  <rect x="720" y="105" width="430" height="450" rx="24" fill="#EEF4FF" stroke="#2E66E8" stroke-width="3"/>
  <text x="935" y="155" class="h" text-anchor="middle">Papéis separados e recuperáveis</text>
  <rect x="755" y="195" width="150" height="58" rx="12" fill="#0B1B34"/><text x="830" y="232" class="tag" text-anchor="middle">Agent</text>
  <rect x="955" y="195" width="160" height="58" rx="12" fill="#2E66E8"/><text x="1035" y="232" class="tag" text-anchor="middle">Playbook</text>
  <rect x="755" y="280" width="150" height="58" rx="12" fill="#1C8A68"/><text x="830" y="317" class="tag" text-anchor="middle">Skill</text>
  <rect x="955" y="280" width="160" height="58" rx="12" fill="#6A57D2"/><text x="1035" y="317" class="tag" text-anchor="middle">Knowledge</text>
  <rect x="755" y="365" width="150" height="58" rx="12" fill="#C85A00"/><text x="830" y="402" class="tag" text-anchor="middle">Contract</text>
  <rect x="955" y="365" width="160" height="58" rx="12" fill="#147D7E"/><text x="1035" y="402" class="tag" text-anchor="middle">Eval</text>
  <rect x="850" y="450" width="170" height="58" rx="12" fill="#6A57D2"/><text x="935" y="487" class="tag" text-anchor="middle">Evidence</text>
  <text x="935" y="535" class="t" text-anchor="middle">uma fonte canônica por responsabilidade</text>
</svg>
