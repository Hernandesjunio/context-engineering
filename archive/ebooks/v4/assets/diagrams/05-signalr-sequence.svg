  <g font-family="DejaVu Sans" font-size="16" fill="#17212B"><text x="145" y="180">1. POST /reports</text><text x="430" y="235">2. criar job durável</text><text x="145" y="290">3. 202 + jobId + statusUrl</text><text x="385" y="345">4. processar</text><text x="625" y="410">5. persistir estado final</text><text x="640" y="475" fill="#16815D" font-weight="700">6. commit confirmado</text><text x="705" y="530">7. publicar conclusão</text><text x="570" y="585">8. atualizar tela</text></g>
