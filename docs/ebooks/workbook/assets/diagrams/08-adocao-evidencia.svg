<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="680" viewBox="0 0 1150 680">
  <rect width="1150" height="680" rx="28" fill="#F5F7FB"/>
  <style>.title{font:700 34px 'DejaVu Sans',sans-serif;fill:#17212B}.h{font:700 22px 'DejaVu Sans',sans-serif;fill:white}.t{font:400 16px 'DejaVu Sans',sans-serif;fill:#425166}.light{fill:white}.s{font:700 17px 'DejaVu Sans',sans-serif;fill:#17212B}.edge{stroke:#2E66E8;stroke-width:3;fill:none}.feedback{stroke:#6A57D2;stroke-width:3;fill:none}.gate{stroke:#A86F00;stroke-width:2;fill:#FFF7DB}.dash{stroke:#A86F00;stroke-width:2;stroke-dasharray:6 6}</style>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#2E66E8"/></marker>
    <marker id="back" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#6A57D2"/></marker>
  </defs>
  <text x="45" y="58" class="title">Adoção orientada por gates de evidência</text>

  <circle cx="175" cy="210" r="95" fill="#0B1B34"/>
  <text x="175" y="205" class="h" text-anchor="middle">POC</text>
  <text x="175" y="238" class="t light" text-anchor="middle">1 domínio · baseline</text>

  <path d="M270 210 H405" class="edge" marker-end="url(#arrow)"/>
  <rect x="238" y="320" width="210" height="76" rx="14" class="gate"/>
  <text x="343" y="350" class="s" text-anchor="middle">Gate 1</text>
  <text x="343" y="378" class="t" text-anchor="middle">recuperação + custo</text>
  <path d="M343 320 V228" class="dash"/>

  <rect x="415" y="120" width="300" height="180" rx="28" fill="#2E66E8"/>
  <text x="565" y="190" class="h" text-anchor="middle">PILOTO</text>
  <text x="565" y="225" class="t light" text-anchor="middle">2–3 equipes · regressão</text>
  <text x="565" y="255" class="t light" text-anchor="middle">telemetria e revisão humana</text>

  <path d="M715 210 H835" class="edge" marker-end="url(#arrow)"/>
  <rect x="675" y="320" width="210" height="76" rx="14" class="gate"/>
  <text x="780" y="350" class="s" text-anchor="middle">Gate 2</text>
  <text x="780" y="378" class="t" text-anchor="middle">qualidade + operação</text>
  <path d="M780 320 V228" class="dash"/>

  <circle cx="950" cy="210" r="105" fill="#1C8A68"/>
  <text x="950" y="200" class="h" text-anchor="middle">PADRÃO</text>
  <text x="950" y="226" class="t light" text-anchor="middle">governança</text>
  <text x="950" y="251" class="t light" text-anchor="middle">manutenção e</text>
  <text x="950" y="276" class="t light" text-anchor="middle">regressão contínua</text>

  <path d="M950 315 C885 565 300 565 175 305" class="feedback" marker-end="url(#back)"/>
  <rect x="325" y="407" width="500" height="48" rx="12" fill="#F5F7FB"/>
  <text x="575" y="438" class="s" text-anchor="middle">medir → aprender → ajustar artefatos → repetir</text>
  <text x="575" y="615" class="t" text-anchor="middle">Nenhum avanço é automático: cada transição depende do gate aprovado.</text>
</svg>
