<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="700" viewBox="0 0 1150 700">
  <rect width="1150" height="700" rx="28" fill="#F5F7FB"/>
  <style>.title{font:700 34px 'DejaVu Sans',sans-serif;fill:#17212B}.h{font:700 21px 'DejaVu Sans',sans-serif;fill:#17212B}.t{font:400 17px 'DejaVu Sans',sans-serif;fill:#425166}.light{fill:white}.n{font:700 21px 'DejaVu Sans',sans-serif;fill:white}.edge{stroke:#7E91A6;stroke-width:3;fill:none}.label{font:700 16px 'DejaVu Sans',sans-serif;fill:#425166}</style>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7E91A6"/></marker></defs>
  <text x="45" y="58" class="title">Progressive disclosure: detalhe sob demanda</text>

  <rect x="90" y="105" width="260" height="90" rx="18" fill="#0B1B34"/>
  <text x="220" y="145" class="n" text-anchor="middle">1 · Navegar</text>
  <text x="220" y="174" class="t light" text-anchor="middle">mapa curto de capacidades</text>

  <path d="M220 195 V250" class="edge" marker-end="url(#arrow)"/>
  <rect x="70" y="260" width="300" height="115" rx="18" fill="#EEF4FF" stroke="#2E66E8" stroke-width="3"/>
  <text x="220" y="305" class="h" text-anchor="middle">2 · Gatilho aplicável?</text>
  <text x="220" y="338" class="t" text-anchor="middle">a tarefa é assíncrona?</text>
  <text x="220" y="365" class="t" text-anchor="middle">há contrato de API?</text>

  <path d="M370 317 H575" class="edge" marker-end="url(#arrow)"/>
  <text x="472" y="295" class="label" text-anchor="middle">SIM</text>
  <rect x="585" y="260" width="350" height="115" rx="18" fill="#F2EFFE" stroke="#6A57D2" stroke-width="3"/>
  <text x="760" y="305" class="h" text-anchor="middle">3 · Abrir o necessário</text>
  <text x="760" y="338" class="t" text-anchor="middle">playbook + regra + contract</text>
  <text x="760" y="365" class="t" text-anchor="middle">sem carregar o acervo inteiro</text>

  <path d="M220 375 V500" class="edge" marker-end="url(#arrow)"/>
  <text x="245" y="445" class="label">NÃO</text>
  <rect x="55" y="515" width="365" height="105" rx="18" fill="#FFF6E8" stroke="#E79B35" stroke-width="3"/>
  <text x="238" y="555" class="h" text-anchor="middle">Pedir o dado ausente</text>
  <text x="238" y="587" class="t" text-anchor="middle">ou seguir o caminho simples</text>

  <path d="M760 375 V500" class="edge" marker-end="url(#arrow)"/>
  <rect x="555" y="515" width="410" height="105" rx="18" fill="#EAF8F2" stroke="#1C8A68" stroke-width="3"/>
  <text x="760" y="555" class="h" text-anchor="middle">4 · Executar e provar</text>
  <text x="760" y="587" class="t" text-anchor="middle">tool, teste, trace e Evidence Record</text>
</svg>
