<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2563EB"/></marker></defs>
  <rect width="1200" height="650" rx="28" fill="#F7F9FC"/>
  <text x="60" y="70" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#17212B">De onde vêm os campos do Eval</text>
  <g font-family="DejaVu Sans" text-anchor="middle">
    <rect x="60" y="140" width="220" height="100" rx="16" fill="#FFF6E8" stroke="#E79B35" stroke-width="3"/><text x="170" y="180" font-size="19" font-weight="700">Fontes aprovadas</text><text x="170" y="211" font-size="15">original + refatorada</text>
    <rect x="340" y="140" width="220" height="100" rx="16" fill="#EAF3FF" stroke="#2563EB" stroke-width="3"/><text x="450" y="180" font-size="19" font-weight="700">Autor do Eval</text><text x="450" y="211" font-size="15">deriva assertions</text>
    <rect x="620" y="110" width="250" height="62" rx="13" fill="#071529"/><text x="745" y="149" font-size="17" font-weight="700" fill="white">mustRetrieve → artefatos</text>
    <rect x="620" y="185" width="250" height="62" rx="13" fill="#16815D"/><text x="745" y="224" font-size="17" font-weight="700" fill="white">mustApply → obrigações</text>
    <rect x="620" y="260" width="250" height="62" rx="13" fill="#B45309"/><text x="745" y="299" font-size="17" font-weight="700" fill="white">mustNotClaim → proibições</text>
    <rect x="930" y="170" width="210" height="100" rx="16" fill="#6D5BD0"/><text x="1035" y="210" font-size="19" font-weight="700" fill="white">Eval Spec</text><text x="1035" y="241" font-size="15" fill="#F2EFFE">entrada versionada</text>
    <rect x="340" y="410" width="220" height="100" rx="16" fill="#0F766E"/><text x="450" y="450" font-size="19" font-weight="700" fill="white">Eval Runner</text><text x="450" y="481" font-size="15" fill="#EAF8F2">executa e captura</text>
    <rect x="650" y="410" width="220" height="100" rx="16" fill="#B45309"/><text x="760" y="450" font-size="19" font-weight="700" fill="white">Avaliador</text><text x="760" y="481" font-size="15" fill="#FFF6E8">compara fatos</text>
    <rect x="930" y="410" width="210" height="100" rx="16" fill="#6D5BD0"/><text x="1035" y="450" font-size="19" font-weight="700" fill="white">Evidence Record</text><text x="1035" y="481" font-size="15" fill="#F2EFFE">saída auditável</text>
  </g>
  <g stroke="#2563EB" stroke-width="6" fill="none" marker-end="url(#a)"><path d="M280 190H335"/><path d="M560 190H610"/><path d="M875 220H925"/><path d="M1035 275V355Q1035 375 1015 375H450Q430 375 430 405"/><path d="M560 460H645"/><path d="M870 460H925"/></g>
  <text x="60" y="585" font-family="DejaVu Sans" font-size="18" fill="#4B5563">IDs são criados pelo time de curadoria a partir de comportamentos aprovados; não são retornos arbitrários de API.</text>
</svg>
